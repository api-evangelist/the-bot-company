description: 'The Bot Company is a San Francisco robotics startup founded in 2024 by Kyle Vogt,
  the co-founder and former CEO of Cruise, building a helpful general-purpose robot for every home
  to automate everyday household chores. Its team draws from Tesla, Cruise, OpenAI, Google, and Pixar,
  and the company has raised roughly $301M (reportedly valued near $2B) from investors including
  Spark Capital and SV Angel. As of this profile the company operates a marketing and careers site
  only and publishes no public developer API, SDK, documentation, or developer portal.'
